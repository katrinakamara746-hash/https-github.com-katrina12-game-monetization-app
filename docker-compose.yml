version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: game_monetization_db
    environment:
      POSTGRES_DB: game_monetization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monetization_network

  redis:
    image: redis:7-alpine
    container_name: game_monetization_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monetization_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: game_monetization_backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=game_monetization
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - monetization_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: game_monetization_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - monetization_network

volumes:
  postgres_data:
  redis_data:

networks:
  monetization_network:
    driver: bridge
